# SPDX-License-Identifier: GPL-2.0-or-later
# ca: issue or revoke one author certificate (ADR 0046).
#
# Two tiers of certificate (lead decision 2026-11-04), both issued without anyone clicking in GitHub:
#   origin   says who made a file and from which repository; the Worker starts this workflow as soon as the person or
#            organisation has accepted the CLA (request field cla_accepted_at), with no approval.
#   trusted  a vetted developer or organisation; the Worker starts it when an admin presses Approve in the admin panel
#            (approved_by/approved_at), and only logins in CA_APPROVERS count.
# The Worker calls the GitHub API (POST /repos/wonderlandos/hub-pipeline/actions/workflows/ca.yml/dispatches, inputs
# {request_id, dry_run: "false"}) with the hub GitHub App's installation token (actions:write, nothing else here). The job
# fetches the request from the Worker with its OIDC token (GET /api/pipeline/requests/<id>), writes it to
# requests/<id>.json in this job's workspace, has woltrust check the proof and sign, commits certs/<serial>.wolcert and
# certs/<serial>.json (the tier, the request id) to the public log wonderlandos/hub-log (checkout log/, the ca
# environment's deploy key HUB_LOG_DEPLOY_KEY), keeps the request file as a run artifact of this private repository, and
# tells the Worker the serial (POST /api/pipeline/certs). README, "How a certificate is issued". Revoking a trusted
# certificate as superseded downgrades: the index shows its files as origin.
# A request file the CA operator committed here (reviewed into main like any change) is handled with input `request`.
# The request files themselves are never published: hub-log carries the certificate, its record and revocations.json.
#
# Environment "ca": deployment branch main only. No required reviewers: an origin certificate needs none (the CLA is the
# condition), and for a trusted one the second person is the admin whose approval is in the request (approved_by). It holds (names only):
#   secret  WOLOS_AUTHORS_CA_KEY   the Authors CA intermediate's key material (plain or a locked .wolkey)
#   secret  WOLOS_KEY_PASSPHRASE   the passphrase of a locked .wolkey (woltrust --passphrase-env)
#   secret  HUB_LOG_DEPLOY_KEY     this environment's write deploy key of wonderlandos/hub-log (ssh, private half)
#   var     AUTHORS_CA_SERIAL      serial of the Authors CA certificate (16 hex; its .wolcert is in hub-log certs/intermediates/)
#   var     CA_APPROVERS           GitHub logins of the hub admins who may approve, comma separated
#
# dry_run (the default of a manual run) issues with the TEST Authors CA of woltrust (scripts/test-keys.mjs, real
# woltrust, a key derived from a public name) in a scratch folder: shown in the log, kept as an artifact marked test;
# nothing in the repository or the Worker changes.
name: ca

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Request file under requests/ (e.g. requests/alice-2026-11.json); or give request_id"
        type: string
        required: false
      request_id:
        description: "Id of a request approved in the hub admin panel (the Worker sends it): an issue request, or a revocation / version withdrawal (v-...)"
        type: string
        required: false
      dry_run:
        description: "Dry run with the TEST CA (default)"
        type: boolean
        default: true

concurrency:
  group: hub-pipeline-ca
  cancel-in-progress: false

permissions: {}

jobs:
  ca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ca
    permissions:
      contents: read    # this repository; certs/ and revocations.json go to hub-log with HUB_LOG_DEPLOY_KEY
      actions: write    # to start sign.yml after a revocation
      id-token: write   # the Worker's approved request, and telling it the serial
    env:
      REQUEST: ${{ inputs.request }}
      REQUEST_ID: ${{ inputs.request_id }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      CA_APPROVERS: ${{ vars.CA_APPROVERS }}
      # Read-only GitHub lookups of the signed github_id (login, name, public org membership, org owner): audit-1 H2.
      # CA_GITHUB_TOKEN (optional secret, members:read on the organisations) lets the job see an owner role in an
      # organisation; without it an organisation certificate is refused (the job cannot confirm the owner).
      GITHUB_TOKEN: ${{ github.token }}
      CA_GITHUB_TOKEN: ${{ secrets.CA_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out the public log (wonderlandos/hub-log)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wonderlandos/hub-log
          ref: main
          path: log
          ssh-key: ${{ secrets.HUB_LOG_DEPLOY_KEY }}

      - name: The schema here is the one hub-log publishes
        run: diff -r schema log/schema

      - name: Get the request
        run: |
          # The inputs are data, never code: they reach the shell only through the environment. From a dispatch only
          # request_id is used, as an id: the request itself comes from the Worker over OIDC and is checked again here
          # (its id must be this one), and what is signed comes from the requester's proof and from GitHub (ca.mjs).
          if [ -n "$REQUEST_ID" ]; then
            [ -z "$REQUEST" ] || { echo "give request or request_id, not both"; exit 1; }
            [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] || { echo "not a request id"; exit 1; }
            # Handled already (a second dispatch): a certificate record in the log names this request. ca.mjs refuses a
            # second active certificate per account and tier as well.
            if REQUEST_ID="$REQUEST_ID" node -e 'const f=require("fs"),d="log/certs";process.exit(f.existsSync(d)&&f.readdirSync(d).filter(n=>/^([0-9a-f]{16}|[0-9a-f]{128})\.json$/.test(n)).some(n=>JSON.parse(f.readFileSync(d+"/"+n)).request_id===process.env.REQUEST_ID)?0:1)'; then
              echo "request $REQUEST_ID was handled already"; exit 1
            fi
            node scripts/api.mjs request --id "$REQUEST_ID" --out "requests/$REQUEST_ID.json"
            REQUEST=requests/$REQUEST_ID.json
            echo "REQUEST=$REQUEST" >> "$GITHUB_ENV"
          fi
          [[ "$REQUEST" =~ ^requests/[A-Za-z0-9._-]+\.json$ ]] || { echo "the request must be a file directly under requests/"; exit 1; }
          if [ ! -f "$REQUEST" ] || [ -L "$REQUEST" ]; then echo "$REQUEST is not a plain file"; exit 1; fi
          node scripts/validate.mjs request "$REQUEST"
          action=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.REQUEST)).action')
          # The Worker's ids: v-... is a revocation (a certificate, or a version with reason withdrawn-version), anything else an issue.
          if [ -n "$REQUEST_ID" ]; then
            want=issue; [[ $REQUEST_ID == v-* ]] && want=revoke
            [ "$action" = "$want" ] || { echo "request $REQUEST_ID is a $action request; its id says $want"; exit 1; }
            [ "$(node -p 'JSON.parse(require("fs").readFileSync(process.env.REQUEST)).id')" = "$REQUEST_ID" ] || { echo "the request's id is not $REQUEST_ID"; exit 1; }
          fi
          echo "ACTION=$action" >> "$GITHUB_ENV"

      - name: Build woltrust (pinned, from source)
        id: woltrust
        run: echo "bin=$(scripts/tool.sh woltrust | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Dry run with the TEST CA
        if: env.DRY_RUN == '1'
        env:
          WOLTRUST: ${{ steps.woltrust.outputs.bin }}
        run: |
          work="$RUNNER_TEMP/ca-dry"
          mkdir -p "$work/certs" "$work/keys"
          cp log/revocations.json "$work/revocations.json" 2>/dev/null || echo '{"format":1,"entries":[]}' > "$work/revocations.json"
          cp log/certs/*.wolcert log/certs/*.json "$work/certs/" 2>/dev/null || true
          if [ "$ACTION" = issue ]; then
            node scripts/test-keys.mjs "$work/keys"
            # TEST: without CA_APPROVERS the request's own approvers stand in (only the TEST CA signs here).
            approvers=(--approvers "${CA_APPROVERS:-$(node -p '(JSON.parse(require("fs").readFileSync(process.env.REQUEST)).approved_by ?? []).join(",")')}")
            node scripts/ca.mjs issue --request "$REQUEST" --certs "$work/certs" --issuer-serial "$(cat "$work/keys/authors.serial")" \
              --key-file "$work/keys/authors.key" --intermediates fixtures/trust/intermediates --source "$work/revocations.json" "${approvers[@]}"
            rm -rf "$work/keys"
          else
            node scripts/ca.mjs revoke --request "$REQUEST" --certs "$work/certs" --source "$work/revocations.json" --index log/signed/index.json \
              --approvers "${CA_APPROVERS:-$(node -p '(JSON.parse(require("fs").readFileSync(process.env.REQUEST)).approved_by ?? []).join(",")')}"
          fi
          echo "TEST ONLY: issued by the TEST Authors CA; nothing was written to the repository or the Worker" >> "$work/TEST-ONLY.txt"

      - name: Issue or revoke
        if: env.DRY_RUN != '1'
        env:
          WOLOS_AUTHORS_CA_KEY: ${{ secrets.WOLOS_AUTHORS_CA_KEY }}
          WOLOS_KEY_PASSPHRASE: ${{ secrets.WOLOS_KEY_PASSPHRASE }}
          CA_SERIAL: ${{ vars.AUTHORS_CA_SERIAL }}
          WOLTRUST: ${{ steps.woltrust.outputs.bin }}
        run: |
          if [ "$ACTION" = issue ]; then
            node scripts/ca.mjs issue --request "$REQUEST" --certs log/certs --issuer-serial "${CA_SERIAL:?AUTHORS_CA_SERIAL is not set}" \
              --intermediates log/certs/intermediates --source log/revocations.json --approvers "$CA_APPROVERS" \
              --key-env WOLOS_AUTHORS_CA_KEY --passphrase-env WOLOS_KEY_PASSPHRASE --result "$RUNNER_TEMP/issued.json"
          else
            node scripts/ca.mjs revoke --request "$REQUEST" --certs log/certs --source log/revocations.json --index log/signed/index.json \
              --approvers "$CA_APPROVERS"
          fi

      - name: Commit to hub-log
        if: env.DRY_RUN != '1'
        run: |
          scripts/commit-log.sh "ca: $ACTION $(basename "$REQUEST" .json)" certs revocations.json

      - name: Keep the request as a run artifact of this private repository, never in the public log
        if: env.DRY_RUN != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ca-request
          path: ${{ env.REQUEST }}
          retention-days: 90

      - name: Tell the Worker the serial
        if: env.DRY_RUN != '1' && env.ACTION == 'issue' && env.REQUEST_ID != ''
        run: node scripts/api.mjs issued --in "$RUNNER_TEMP/issued.json"

      - name: Tell the Worker the revocation is published
        if: env.DRY_RUN != '1' && env.ACTION == 'revoke' && env.REQUEST_ID != ''
        run: node scripts/api.mjs revoked --id "$REQUEST_ID" --serial "$(node -p 'JSON.parse(require("fs").readFileSync(process.env.REQUEST)).serial')"

      - name: Publish a revocation now
        if: env.DRY_RUN != '1' && env.ACTION == 'revoke'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sign.yml --ref main -f dry_run=false

      - name: Keep the dry run
        if: always() && env.DRY_RUN == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ca-dry-run-TEST-ONLY
          path: ${{ runner.temp }}/ca-dry
          if-no-files-found: ignore
          retention-days: 3

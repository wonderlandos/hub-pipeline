# SPDX-License-Identifier: GPL-2.0-or-later
# ci: every script and fixture of this repository with the real pinned woltrust and hubcheck; no secret, no network
# but the tool build and a read-only checkout of the public log (schema/ must be byte for byte its schema/).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # sign.yml stops when schema/ is not the one the public log publishes: catch that here, at the commit that changes it.
      - name: Check out the public log (read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wonderlandos/hub-log
          ref: main
          path: log
          persist-credentials: false
      - name: The schema here is the one hub-log publishes
        run: scripts/schema-sync.sh log
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/hub-pipeline-tools
          key: ci-tools-${{ hashFiles('tools/woltrust.rev', 'tools/hubcheck.rev', 'scripts/tool.sh') }}
      - run: scripts/test.sh
